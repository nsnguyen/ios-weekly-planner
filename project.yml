name: WeeklyPlanner

# Generated by XcodeGen. Edit this file, then run `xcodegen generate`.
# The generated .xcodeproj is intentionally git-ignored — project.yml is the source of truth.

options:
  bundleIdPrefix: com.weeklyplanner
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  xcodeVersion: "17.0"
  groupSortPosition: top
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    DEAD_CODE_STRIPPING: YES
    # Empty team — set DEVELOPMENT_TEAM via local override or CI secret before signed builds.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ENABLE_TESTABILITY: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      VALIDATE_PRODUCT: YES

packages:
  swift-collections:
    url: https://github.com/apple/swift-collections
    from: "1.1.0"
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: "4.2.2"
  GoogleSignIn-iOS:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.1.0"

targets:
  WeeklyPlanner:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WeeklyPlanner
        excludes:
          - "**/.DS_Store"
          - "Supporting/Info.plist"
          - "Supporting/WeeklyPlanner.entitlements"
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weeklyplanner.WeeklyPlanner
        PRODUCT_NAME: WeeklyPlanner
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_INTERFACE_ORIENTATIONS: UIInterfaceOrientationPortrait
        INFOPLIST_FILE: WeeklyPlanner/Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: WeeklyPlanner/Supporting/WeeklyPlanner.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        ENABLE_PREVIEWS: YES
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_GoogleClientID: $(GOOGLE_CLIENT_ID)
    dependencies:
      - package: swift-collections
        product: Collections
      - package: KeychainAccess
      - package: GoogleSignIn-iOS
        product: GoogleSignIn

  WeeklyPlannerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WeeklyPlannerTests
        excludes:
          - "**/.DS_Store"
          - "WeeklyPlannerTests.entitlements"
    dependencies:
      - target: WeeklyPlanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weeklyplanner.WeeklyPlannerTests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_ENTITLEMENTS: WeeklyPlannerTests/WeeklyPlannerTests.entitlements

  WeeklyPlannerUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WeeklyPlannerUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: WeeklyPlanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weeklyplanner.WeeklyPlannerUITests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"

schemes:
  WeeklyPlanner:
    build:
      targets:
        WeeklyPlanner: all
        WeeklyPlannerTests: [test]
        WeeklyPlannerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - WeeklyPlannerTests
        - WeeklyPlannerUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
