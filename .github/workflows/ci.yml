name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Install build tools
        run: |
          brew update
          brew install xcodegen
          # Pin the linters. swiftlint_baseline.json and the formatted tree
          # match these releases; a floating Homebrew formula will fail the gates.
          curl -fsSL -o /tmp/swiftlint.zip -L https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          unzip -q -o /tmp/swiftlint.zip -d /tmp/swiftlint-bin
          curl -fsSL -o /tmp/swiftformat.zip -L https://github.com/nicklockwood/SwiftFormat/releases/download/0.63.0/swiftformat.zip
          unzip -q -o /tmp/swiftformat.zip -d /tmp/swiftformat-bin
          mkdir -p "$HOME/.local/bin"
          install -m 755 /tmp/swiftlint-bin/swiftlint "$HOME/.local/bin/swiftlint"
          install -m 755 /tmp/swiftformat-bin/swiftformat "$HOME/.local/bin/swiftformat"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          swiftlint version
          swiftformat --version

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Provide placeholder secrets
        run: |
          if [ ! -f Secrets.xcconfig ]; then
            cp Secrets.example.xcconfig Secrets.xcconfig
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: SwiftLint
        run: swiftlint --strict --baseline swiftlint_baseline.json --reporter github-actions-logging

      - name: SwiftFormat lint
        run: swiftformat --lint .

      - name: List available simulators
        run: xcrun simctl list devices available | grep -E "iPhone .*(Pro|17|18)" || true

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project WeeklyPlanner.xcodeproj \
            -scheme WeeklyPlanner \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
